<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <title>Meu Financeiro</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icons/icon-192.svg" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="toast" class="toast"></div>

  <section id="loginScreen" class="login-screen hidden">
    <div class="login-bg"></div>
    <div class="login-card animate-in">
      <div class="brand-mark">R$</div>
      <p class="eyebrow">Financeiro pessoal</p>
      <h1>Controle seu dinheiro com clareza.</h1>
      <p class="muted">Gastos, caixinhas, investimentos e patrimônio em uma visão bonita e simples de usar.</p>
      <form id="loginForm" class="form-stack">
        <label>
          E-mail
          <input name="email" type="email" autocomplete="username" placeholder="seuemail@email.com" required />
        </label>
        <label>
          Senha
          <input name="password" type="password" autocomplete="current-password" placeholder="Sua senha" required />
        </label>
        <button class="btn primary full" type="submit">Entrar no app</button>
      </form>
      <small class="muted">Configure o acesso pelas variáveis APP_EMAIL e APP_PASSWORD no EasyPanel.</small>
    </div>
  </section>

  <main id="appShell" class="app-shell hidden">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-mark small">R$</div>
        <div>
          <strong id="appName">Meu Financeiro</strong>
          <span>Organizador pessoal</span>
        </div>
      </div>
      <nav class="nav-list" id="desktopNav"></nav>
      <div class="sidebar-footer">
        <button class="ghost-btn" id="themeToggle" type="button">Alternar tema</button>
        <button class="ghost-btn danger" id="logoutBtn" type="button">Sair</button>
      </div>
    </aside>

    <section class="content-area">
      <header class="topbar">
        <div>
          <p class="eyebrow" id="pageEyebrow">Visão geral</p>
          <h1 id="pageTitle">Dashboard</h1>
        </div>
        <div class="topbar-actions">
          <span class="live-pill" id="liveStatus"><i></i> Tempo real</span>
          <button class="btn secondary" data-open-modal="quickAdd">+ Lançar</button>
        </div>
      </header>

      <div id="pageContent" class="page-content"></div>
    </section>

    <nav class="mobile-nav" id="mobileNav"></nav>
  </main>

  <div id="modalBackdrop" class="modal-backdrop hidden">
    <section class="modal animate-up" id="modalBox">
      <button class="modal-close" id="modalClose" type="button">×</button>
      <div id="modalContent"></div>
    </section>
  </div>

  <script src="/app.js"></script>
</body>
</html>
